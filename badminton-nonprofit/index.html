<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rally Forward Foundation — Badminton & Para-Badminton for Every American</title>
    <meta
      name="description"
      content="Rally Forward Foundation is a nonprofit growing badminton and para-badminton in the United States — funding athlete pathways, adaptive programs for veterans, and free youth access."
    />
    <meta property="og:title" content="Rally Forward Foundation" />
    <meta
      property="og:description"
      content="Funding athlete pathways, adaptive programs for veterans, and free youth access to badminton across the United States."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- Netlify Forms detects forms in the deployed HTML, not in React output.
         This hidden stub registers the "contact" form; the live form lives in
         src/pages/ContactPage.jsx and posts back to this same form name. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
